name: Render wedding media
on:
  push:
    paths:
      - 'media/*.svg'
      - '.github/workflows/render-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: rsvg-convert -w 1080 -h 1350 media/elite-post.svg -o media/elite-post.png
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/elite-post.png
          git diff --cached --quiet || git commit -m "Render Elite Wedding Planner PNG"
          git push
